<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ЖАР — кухня на живому вогні, Поділ</title>
  <meta name="description" content="Сучасна українська кухня на дубовому та вишневому вугіллі. Київ, Поділ. Бронювання столів онлайн.">
  <meta name="theme-color" content="#e4dfd6">
  <meta property="og:title" content="ЖАР — кухня на живому вогні">
  <meta property="og:image" content="https://yehorss.github.io/restaurant-demo/zhar/photos/hero.webp">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231c1917'/%3E%3Crect x='4' y='4' width='8' height='8' fill='%23f46a1f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600&family=Manrope:wght@400;600&display=swap">
  <script>document.documentElement.classList.add('js')</script>
</head>
<body>
  <a class="skip" href="#menu" data-i18n="nav.menu">Меню</a>

  <header class="hero" id="top">
    <div class="bar">
      <a class="mark" href="#top" aria-label="ЖАР">ЖАР</a>
      <nav aria-label="Розділи" data-i18n-aria="nav.label">
        <a href="#menu" data-i18n="nav.menu">Меню</a>
        <a href="#fire" data-i18n="nav.fire">Вогонь</a>
        <a href="#visit" data-i18n="nav.visit">Як знайти</a>
        <button type="button" class="lang" id="lang" data-i18n="lang.switch">EN</button>
      </nav>
    </div>
    <h1 class="name">
      <span class="name-text">ЖАР</span>
      <span class="ember" aria-hidden="true">
        <video autoplay muted loop playsinline preload="metadata" poster="./video/embers.jpg" width="600" height="480">
          <source src="./video/embers.webm" type="video/webm">
        </video>
      </span>
    </h1>
    <div class="hero-foot">
      <p data-i18n="hero.line"></p>
      <button type="button" class="btn" data-open-booking data-i18n="hero.book">Забронювати стіл</button>
    </div>
  </header>

  <main>
    <section class="intro" aria-labelledby="intro-h">
      <div class="intro-top">
        <h2 id="intro-h" data-rise data-i18n="intro.title"></h2>
        <p data-rise data-i18n="intro.text"></p>
      </div>
      <dl class="facts">
        <div data-rise><dt>12:00</dt><dd data-i18n="fact.open"></dd></div>
        <div data-rise><dt data-i18n="fact.wood.n">140 кг</dt><dd data-i18n="fact.wood"></dd></div>
        <div data-rise><dt>7</dt><dd data-i18n="fact.dishes"></dd></div>
        <div data-rise><dt>66</dt><dd data-i18n="fact.seats"></dd></div>
      </dl>
      <figure class="intro-pic" data-rise><img src="./photos/about.webp" alt="" loading="lazy" width="1200" height="800"></figure>
    </section>

    <section class="now" id="fire" aria-labelledby="now-h">
      <div class="now-text">
        <h2 id="now-h" data-rise data-i18n="now.title"></h2>
        <p class="now-clock" data-rise><span id="now-time">--:--</span> <span data-i18n="now.at"></span></p>
        <p class="now-line" id="now-line" data-rise aria-live="polite"></p>
        <p class="now-next" id="now-next" data-rise></p>
        <button type="button" class="btn" data-open-booking data-i18n="book.open" data-rise>Забронювати стіл</button>
      </div>
      <ol class="phases" aria-label="12:00 · 17:00 · 21:00">
        <li data-phase="oak" data-rise><span class="ph-time">12:00</span><span class="ph-name" data-i18n="phase.oak"></span><span class="ph-what" data-i18n="phase.oak.d"></span></li>
        <li data-phase="cherry" data-rise><span class="ph-time">17:00</span><span class="ph-name" data-i18n="phase.cherry"></span><span class="ph-what" data-i18n="phase.cherry.d"></span></li>
        <li data-phase="embers" data-rise><span class="ph-time">21:00</span><span class="ph-name" data-i18n="phase.embers"></span><span class="ph-what" data-i18n="phase.embers.d"></span></li>
      </ol>
    </section>

    <section class="menu" id="menu" aria-labelledby="menu-h">
      <div class="menu-col">
        <h2 id="menu-h" class="giant" data-rise data-i18n="menu.title">Меню</h2>
        <div id="menu-list" aria-busy="true"></div>
        <p class="menu-lead" data-rise data-i18n="menu.lead"></p>
      </div>
    </section>

    <section class="wood" aria-labelledby="wood-h">
      <div class="wood-pin"><h2 id="wood-h" data-rise data-i18n="wood.title"></h2></div>
      <figure class="wp a" data-rise><img src="./photos/hero.webp" alt="" loading="lazy" width="1200" height="800"><figcaption data-i18n="wood.1"></figcaption></figure>
      <figure class="wp b" data-rise><img src="./photos/22.webp" alt="" loading="lazy" width="1200" height="800"><figcaption data-i18n="wood.2"></figcaption></figure>
      <figure class="wp a" data-rise><img src="./photos/25.webp" alt="" loading="lazy" width="1200" height="800"><figcaption data-i18n="wood.3"></figcaption></figure>
      <figure class="wp b" data-rise><img src="./photos/23.webp" alt="" loading="lazy" width="1200" height="800"><figcaption data-i18n="wood.4"></figcaption></figure>
    </section>

    <section class="visit" id="visit" aria-labelledby="visit-h">
      <h2 id="visit-h" class="visit-h" data-i18n="visit.title"></h2>
      <p class="visit-lead" data-rise data-i18n="visit.lead"></p>
      <a class="address" data-rise href="https://www.google.com/maps/search/?api=1&query=%D0%9A%D0%BE%D1%81%D1%82%D1%8F%D0%BD%D1%82%D0%B8%D0%BD%D1%96%D0%B2%D1%81%D1%8C%D0%BA%D0%B0+21+%D0%9A%D0%B8%D1%97%D0%B2" data-i18n="visit.address">Костянтинівська, 21</a>
      <div class="visit-corners">
        <p><a href="tel:+380445550177">+380 44 555 0177</a><br><span data-i18n="visit.city"></span></p>
        <p><span data-i18n="visit.hours"></span><br><button type="button" class="linkish" data-open-booking data-i18n="book.open"></button></p>
      </div>
    </section>
  </main>

  <footer class="foot">
    <p class="foot-name" aria-hidden="true">ЖАР</p>
    <div class="foot-row">
      <ul class="places">
        <li><a href="tel:+380445550177">+380 44 555 0177</a></li>
        <li><span data-i18n="visit.address"></span></li>
        <li><span data-i18n="visit.hours"></span></li>
      </ul>
      <ul class="links">
        <li><a href="#menu" data-i18n="foot.menu"></a></li>
        <li><button type="button" class="linkish" data-open-booking data-i18n="foot.book"></button></li>
        <li><a href="https://restaurant-demo.yehorss.workers.dev/admin/" data-i18n="foot.admin"></a></li>
        <li><a href="https://github.com/YehorSS/restaurant-demo" data-i18n="foot.code"></a></li>
      </ul>
    </div>
    <details class="credits"><summary data-i18n="foot.credits"></summary><ul id="credits"></ul></details>
    <div class="legal"><p data-i18n="foot.demo"></p><a href="#top" data-i18n="foot.top"></a></div>
  </footer>

  <button type="button" class="fab" id="fab" data-open-booking><span data-i18n="book.open">Забронювати стіл</span></button>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
