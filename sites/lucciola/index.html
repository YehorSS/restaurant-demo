<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trattoria Lucciola — Ancona</title>
  <meta name="description" content="Cucina marchigiana di mare e di terra ad Ancona. Prenota un tavolo online.">
  <meta name="theme-color" content="#1f3fa8">
  <meta property="og:title" content="Trattoria Lucciola — Ancona">
  <meta property="og:image" content="https://yehorss.github.io/restaurant-demo/lucciola/photos/primi.webp">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f2cf2e' stroke='%231f3fa8' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Work+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
</head>
<body>
  <a class="skip" href="#menu" data-i18n="nav.menu">Menù</a>
  <header class="top">
    <a class="wordmark" href="#top">Lucciola</a>
    <nav aria-label="Lucciola">
      <a href="#menu" data-i18n="nav.menu">Menù</a>
      <a href="#prenota" data-i18n="nav.book">Prenota</a>
      <a href="#dove" data-i18n="nav.about">Dove siamo</a>
    </nav>
    <button type="button" class="lang" id="lang" data-i18n="lang.switch">English</button>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-text">
        <p class="kicker" data-i18n="hero.kicker">Trattoria · Ancona · dal 1962</p>
        <h1><span class="sun" aria-hidden="true"></span>Lucciola</h1>
        <p class="hero-line" data-i18n="hero.line"></p>
        <div class="hero-actions">
          <a class="btn" href="#prenota" data-i18n="hero.book">Prenota un tavolo</a>
        </div>
        <p class="hours" data-i18n="hero.hours"></p>
      </div>
      <figure class="hero-photo"><img src="./photos/hero.webp" alt="" width="1200" height="800"></figure>
    </section>

    <div class="tiles" aria-hidden="true"></div>

    <section class="menu" id="menu">
      <h2 data-i18n="menu.title">Il menù</h2>
      <p class="note" data-i18n="menu.note"></p>
      <div id="menu-list" class="courses" aria-busy="true"></div>
    </section>

    <div class="tiles" aria-hidden="true"></div>

    <section class="book" id="prenota">
      <div class="book-page">
        <h2 data-i18n="book.title">Il libro delle prenotazioni</h2>
        <p class="lead" data-i18n="book.lead"></p>
        <div id="booking"></div>
      </div>
    </section>

    <section class="about" id="dove">
      <figure><img src="./photos/ancona.webp" alt="" loading="lazy" width="1200" height="800"></figure>
      <div>
        <h2 data-i18n="about.title">Dove siamo</h2>
        <p data-i18n="about.text"></p>
        <address>
          <span data-i18n="about.address"></span><br>
          <span data-i18n="about.phone">Telefono</span>: <a id="phone" href="tel:+390715550142">+39 071 555 0142</a>
        </address>
      </div>
    </section>
  </main>

  <footer class="foot">
    <p class="demo"><span data-i18n="foot.demo"></span> <a href="https://restaurant-demo.yehorss.workers.dev/admin/" data-i18n="foot.admin"></a></p>
    <div class="foot-cols">
      <p class="foot-mark">Lucciola</p>
      <p class="foot-hours" data-i18n="hero.hours"></p>
      <p><a href="https://github.com/YehorSS/restaurant-demo" data-i18n="foot.code"></a></p>
    </div>
    <details class="credits">
      <summary data-i18n="foot.photos">Foto</summary>
      <ul id="credits"></ul>
    </details>
  </footer>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
